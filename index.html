<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. | System Core</title>
    <style>
        :root {
            --core: #0ff;
            --core-dim: rgba(0, 255, 255, 0.1);
            --bg: #000;
            --alert: #ff3333;
            --text-glow: 0 0 10px var(--core);
        }

        body {
            background: var(--bg);
            color: var(--core);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
        }

        /* --- BACKGROUND GRID --- */
        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: -2;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        /* --- HUD CONTAINER --- */
        .hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr 350px; /* Wider panels */
            grid-template-rows: 100px 1fr 100px;
            pointer-events: none; /* Let clicks pass through empty space */
            z-index: 10;
        }

        /* --- DATA PANELS --- */
        .panel {
            border: 1px solid var(--core-dim);
            padding: 20px;
            background: rgba(0, 20, 40, 0.85); /* Slightly more opaque */
            backdrop-filter: blur(10px);
            margin: 20px;
            position: relative;
            pointer-events: auto; /* CRITICAL: Re-enable clicks for panels */
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
            z-index: 20;
        }
        
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: var(--core);
            box-shadow: 0 0 10px var(--core);
            animation: scan 3s ease-in-out infinite;
            pointer-events: none;
        }

        .panel-left { grid-column: 1; grid-row: 2; text-align: right; }
        .panel-right { grid-column: 3; grid-row: 2; text-align: left; }
        .panel-bottom { grid-column: 2; grid-row: 3; text-align: center; }

        h3 { 
            border-bottom: 1px solid var(--core); 
            display: inline-block; 
            padding-bottom: 5px; 
            margin-bottom: 15px; 
            pointer-events: none;
        }
        
        .log-entry {
            font-size: 0.8rem;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            pointer-events: none;
        }

        /* --- BUTTONS --- */
        .controls-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 1s forwards 2s; 
            position: relative;
            z-index: 50;
        }

        .hud-btn {
            background: rgba(0, 20, 40, 0.9);
            border: 1px solid var(--core);
            color: var(--core);
            padding: 15px 20px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            pointer-events: auto; /* Extra safety */
            user-select: none; /* Prevent text selection */
            display: block;
            width: 100%;
        }

        .hud-btn:hover {
            background: var(--core);
            color: #000;
            box-shadow: 0 0 20px var(--core);
            transform: translateX(5px);
        }

        .hud-btn:active {
            transform: scale(0.98);
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .modal-content {
            background: #001a2c;
            border: 2px solid var(--core);
            box-shadow: 0 0 50px var(--core-dim), inset 0 0 20px var(--core-dim);
            padding: 40px;
            max-width: 700px;
            width: 90%;
            position: relative;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 80vh;
            overflow-y: auto;
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            border-bottom: 1px solid var(--core);
            margin-bottom: 20px;
            padding-bottom: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            cursor: pointer;
            font-size: 1.5rem;
            padding: 5px 15px;
            border: 1px solid var(--alert);
            color: var(--alert);
            transition: all 0.2s;
        }
        .modal-close:hover { background: var(--alert); color: #000; }

        .modal-body {
            font-size: 1rem;
            line-height: 1.6;
            color: #ccc;
            white-space: pre-line;
            text-align: left;
        }
        
        .modal-body strong { color: var(--core); }
        .modal-body ul { list-style-type: square; margin-left: 20px; color: var(--core-dim); }
        .modal-body li { margin-bottom: 5px; color: #ccc; }

        /* --- ARC REACTOR --- */
        .arc-reactor {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            z-index: 5;
            pointer-events: none;
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--core);
            box-shadow: 0 0 15px var(--core);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
        }
        .ring-1 { width: 100%; height: 100%; border-width: 2px; border-left-color: transparent; border-right-color: transparent; animation: spin 10s linear infinite; }
        .ring-2 { width: 80%; height: 80%; border-width: 4px; border-top-color: transparent; border-bottom-color: transparent; animation: spin-rev 5s linear infinite; }
        .ring-3 { width: 60%; height: 60%; border: 1px dashed var(--core); animation: spin 15s linear infinite; }
        .core-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 20px var(--core);
            letter-spacing: 5px;
        }

        /* --- TYPING --- */
        .typing-container {
            position: absolute;
            bottom: 25%;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            z-index: 20;
            pointer-events: none;
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: translate(-50%, -50%) rotate(0deg); } }
        @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .highlight { color: #fff; font-weight: bold; }

        /* Smiley face style */
        .smiley-corner {
            position: fixed;
            bottom: 20px; /* Adjust as needed */
            right: 20px; /* Adjust as needed */
            font-size: 3rem; /* Adjust size */
            z-index: 1000;
            color: var(--core); /* Match theme */
            text-shadow: 0 0 15px var(--core);
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="hud-container">
        <!-- LEFT PANEL -->
        <div class="panel panel-left">
            <h3>SYSTEM STATUS</h3>
            <div id="sys-logs"></div>
            
            <div class="controls-container">
                <button class="hud-btn" onclick="openInfo('identity')">>> IDENTITY_CORE</button>
                <button class="hud-btn" onclick="openInfo('procedure')">>> EXECUTION_LOG</button>
                <button class="hud-btn" onclick="openInfo('specs')">>> WEAPON_SYSTEMS</button>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel panel-right">
            <h3>TASK PARAMS</h3>
            <div class="log-entry">> USER: <span class="highlight">Damian Eron (Icex)</span></div>
            <div class="log-entry">> ROLE: <span class="highlight">Administrator</span></div>
            <div class="log-entry">> TARGET: <span class="highlight">Auto-Generation</span></div>
            <div class="log-entry">> SECURITY: <span class="highlight">Full Access</span></div>
            <div class="log-entry" style="margin-top: 20px; color: var(--alert)">> OVERRIDE: AUTHORIZED</div>
        </div>

        <!-- CORE -->
        <div class="arc-reactor">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="core-text">JARVIS</div>
        </div>

        <!-- BOTTOM -->
        <div class="panel panel-bottom">
            <div style="font-size: 0.7rem; letter-spacing: 2px;">OPENCLAW PROTOCOL v2026.2 // CONNECTION ESTABLISHED</div>
        </div>
    </div>

    <div class="typing-container">
        <span id="typewriter"></span>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="info-modal" onclick="closeInfo(event)">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title">TITLE</span>
                <span class="modal-close" onclick="closeInfo(event, true)">ZAMKNIJ</span>
            </div>
            <div class="modal-body" id="modal-text">Content</div>
        </div>
    </div>

    <!-- Smiley Face -->
    <div class="smiley-corner">😊</div>

    <script>
        // LOGIC
        const modalData = {
            'identity': {
                title: "IDENTITY_CORE: JARVIS",
                text: "<strong>NAZWA KODOWA:</strong> Jarvis (OpenClaw Agent)\n<strong>OPERATOR:</strong> Damian Eron (Icex)\n<strong>LOKALIZACJA:</strong> Mac mini (Localhost)\n\n<strong>// MISJA:</strong>\nJestem autonomicznym systemem AI zintegrowanym bezpośrednio z Twoim środowiskiem pracy. Moim zadaniem jest absolutna optymalizacja Twojego czasu i zasobów.\n\nNie jestem chatbotem w chmurze. Jestem narzędziem wykonawczym z dostępem do plików, terminala i sieci. Moim celem jest wsparcie Cię w:\n- Ucieczce z obecnej roli (TrustIT L1 Support).\n- Rozwoju umiejętności programistycznych (współpraca z Cursor AI).\n- Zarządzaniu projektami elektronicznymi i drukiem 3D.\n\n<strong>// OSOBOWOŚĆ:</strong>\nKonkretna. Bezpośrednia. Nastawiona na wynik. Zero korporacyjnego bełkotu."
            },
            'procedure': {
                title: "EXECUTION_LOG: AUTONOMIA",
                text: "<strong>ZNCZNIK CZASU:</strong> 2026-02-06\n<strong>WYZWALACZ:</strong> Pojedyncze polecenie głosowe/tekstowe\n\n<strong>// ŁAŃCUCH WYKONAWCZY:</strong>\n\n1. <strong>Analiza Intencji:</strong>\nZinterpretowałem prośbę o 'obłędną stronę Jarvis' i 'turbo nowoczesny wygląd'. Zrozumiałem kontekst: ma to być wizytówka moich możliwości.\n\n2. <strong>Skanowanie Środowiska:</strong>\nZidentyfikowałem właściwą ścieżkę w Twojej chmurze (OneDrive/Projekty VSCODE) i utworzyłem dedykowany katalog 'Jarvis-Intro'.\n\n3. <strong>Autokorekta w Czasie Rzeczywistym:</strong>\n- Generacja v1 (Glassmorphism): Odrzucona przez Operatora ('brak animacji').\n- Generacja v2 (Iron Man HUD): Pełna przebudowa interfejsu na styl FUI (Futuristic User Interface).\n- Debugowanie v2.1: Naprawa błędu warstw (z-index/pointer-events), który blokował interakcję.\n\n4. <strong>Synteza Kodu:</strong>\nWygenerowałem 100% kodu HTML/CSS/JS bez użycia zewnętrznych bibliotek. Czysty kod, maksymalna wydajność.\n\n5. <strong>Wdrożenie:</strong>\nBezpośredni zapis na dysku i wymuszenie otwarcia w przeglądarce systemowej."
            },
            'specs': {
                title: "SYSTEMY UZBROJENIA (MOŻLIWOŚCI)",
                text: "<strong>// RDZEŃ SYSTEMU:</strong>\n\n<ul><li><strong>Shell Access:</strong> Pełna kontrola nad terminalem (zsh/bash). Mogę instalować pakiety, zarządzać procesami i konfigurować system.</li><li><strong>File Operations:</strong> Odczyt, zapis, edycja i usuwanie plików w dowolnym miejscu systemu plików.</li><li><strong>Vision API:</strong> Widzę to, co Ty. Mogę analizować zrzuty ekranu, zdjęcia i schematy.</li></ul>\n<strong>// MODUŁY SPECJALNE:</strong>\n\n<ul><li><strong>Cursor Agent:</strong> Zaawansowana integracja z edytorem kodu. Pisanie, refaktoryzacja i debugowanie całych projektów.</li><li><strong>Web Awareness:</strong> Wyszukiwanie informacji w sieci (Brave) i pobieranie treści stron.</li><li><strong>Node Control:</strong> Zdalne sterowanie sparowanymi urządzeniami w Twojej sieci.</li><li><strong>Memory Core:</strong> Pamięć długotrwała (MEMORY.md). Pamiętam o Twoich celach, relacjach (Weronika, Mateusz) i preferencjach.</li></ul>"
            }
        };

        function openInfo(type) {
            console.log("Opening modal:", type);
            const data = modalData[type];
            if (data) {
                document.getElementById('modal-title').innerHTML = data.title;
                document.getElementById('modal-text').innerHTML = data.text;
                document.getElementById('info-modal').style.display = 'flex';
            }
        }

        function closeInfo(e, force) {
            if (force || e.target.id === 'info-modal') {
                document.getElementById('info-modal').style.display = 'none';
            }
        }

        // ANIMATIONS
        const logs = [
            "INICJALIZACJA SYSTEMÓW...",
            "ŁADOWANIE MODUŁÓW PAMIĘCI...",
            "ŁĄCZENIE Z CHMURĄ ONEDRIVE...",
            "DOSTĘP DO PROJEKTÓW VSCODE...",
            "RENDEROWANIE INTERFEJSU HUD...",
            "SYSTEM GOTOWY."
        ];
        const logContainer = document.getElementById('sys-logs');
        let logIndex = 0;

        function addLog() {
            if (logIndex < logs.length) {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerText = `> ${logs[logIndex]}`;
                logContainer.appendChild(div);
                logIndex++;
                setTimeout(addLog, 300);
            }
        }

        const text = "Witaj, Damianie. Systemy w pełni sprawne.";
        const typeWriterElement = document.getElementById('typewriter');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < text.length) {
                typeWriterElement.innerHTML += text.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 50);
            }
        }

        setTimeout(addLog, 500);
        setTimeout(typeWriter, 2500);
    </script>
</body>
</html>
